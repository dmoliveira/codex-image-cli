<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
  <title id="title">Codex Image CLI</title>
  <desc id="desc">A colorful terminal pipeline that turns a prompt into image files.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset=".52" stop-color="#172554"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1600" height="540" rx="32" fill="url(#bg)"/>
  <circle cx="1450" cy="80" r="170" fill="#db2777" opacity=".24" filter="url(#blur)"/><circle cx="160" cy="450" r="190" fill="#0891b2" opacity=".24" filter="url(#blur)"/>
  <g opacity=".18" stroke="#dbeafe"><path d="M0 92H1600M0 182H1600M0 272H1600M0 362H1600M0 452H1600"/><path d="M130 0V540M310 0V540M490 0V540M670 0V540M850 0V540M1030 0V540M1210 0V540M1390 0V540"/></g>
  <g transform="translate(116 105)"><text x="0" y="0" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="70" font-weight="800">Codex Image CLI</text><text x="3" y="54" fill="#a5f3fc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24">dry-run → one deliberate API call → verified image files</text><g transform="translate(0 105)"><rect width="650" height="220" rx="18" fill="#07111f" stroke="#334155" stroke-width="2"/><circle cx="30" cy="30" r="8" fill="#fb7185"/><circle cx="56" cy="30" r="8" fill="#fbbf24"/><circle cx="82" cy="30" r="8" fill="#4ade80"/><text x="28" y="82" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">$ mkdir -p artifacts/design</text><text x="28" y="118" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">$ codex-image generate --dry-run</text><text x="28" y="152" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">  --prompt "a luminous rust fox"</text><text x="28" y="192" fill="#86efac" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">→ plan: hero-01.png  hero-02.png</text></g></g>
  <g transform="translate(1010 118)"><path d="M0 154C112 154 102 60 206 60" fill="none" stroke="url(#glow)" stroke-width="8" stroke-linecap="round"/><path d="M188 37l40 23-40 23" fill="none" stroke="#fb7185" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(225 0)"><rect width="250" height="250" rx="28" fill="#f8fafc" opacity=".96"/><rect x="20" y="20" width="210" height="210" rx="18" fill="url(#glow)"/><path d="M47 182c24-96 41-47 66-110 17 48 46 29 74 110" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/><circle cx="79" cy="86" r="19" fill="#fff"/><circle cx="163" cy="74" r="13" fill="#fff"/><path d="M54 202h143" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".9"/></g><text x="235" y="292" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="25" font-weight="700">non-interactive • agent-ready</text></g>
</svg>
