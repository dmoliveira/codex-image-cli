name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Format
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +stable test --all-targets --no-fail-fast
      - name: Check docs and helper scripts
        run: |
          python3 scripts/check_links.py
          python3 -m py_compile scripts/mock_openai_image_api.py scripts/check_links.py
      - name: Build release binary
        run: cargo +stable build --release --locked
      - name: Install and update smoke test
        run: ./scripts/verify-install.sh
      - name: Offline tmux E2E
        if: matrix.os == 'ubuntu-latest'
        run: make e2e
