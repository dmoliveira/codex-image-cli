name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Require a main-line tag commit
        run: |
          git fetch --no-tags origin main
          commit="$(git rev-list -n 1 "$GITHUB_REF")"
          git merge-base --is-ancestor "$commit" origin/main
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$tag" = "$version"
      - name: Validate source and offline helper scripts
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --all-targets --all-features -- -D warnings
          cargo +stable test --all-targets --no-fail-fast
          python3 scripts/check_links.py
          python3 -m py_compile scripts/mock_openai_image_api.py scripts/check_links.py
          bash -n scripts/e2e-local.sh scripts/verify-install.sh
      - name: Verify install and update
        run: ./scripts/verify-install.sh
      - name: Run offline tmux E2E
        run: make e2e
      - name: Build and checksum
        run: |
          cargo +stable build --release --locked
          mkdir -p dist
          tar -C target/release -czf "dist/codex-image-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" codex-image
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
